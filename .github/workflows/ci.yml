name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install liburing
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Cython pytest pytest-asyncio build wheel
          pip install -e .

      - name: Run tests
        run: |
          # io_uring should work on GitHub Actions Ubuntu runners (native VMs)
          pytest -v tests/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: |
          ruff check src/ --ignore E501 || true

  build:
    name: Build source distribution
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install liburing
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build Cython

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [test]
    strategy:
      matrix:
        os: [ubuntu-latest]
        # Only build on Linux since io_uring is Linux-only

    steps:
      - uses: actions/checkout@v4
      
      - name: Install liburing
        run: |
          sudo apt-get update
          sudo apt-get install -y liburing-dev

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_PLATFORM: linux
          CIBW_ARCHS_LINUX: x86_64 aarch64
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"  # Skip musl for now
          CIBW_BEFORE_ALL_LINUX: |
            if command -v apt-get &> /dev/null; then
              apt-get update && apt-get install -y liburing-dev
            elif command -v yum &> /dev/null; then
              yum install -y liburing-devel
            else
              echo "Neither apt-get nor yum found"; exit 1
            fi
          CIBW_BUILD_VERBOSITY: 1
          # Skip tests in wheel build (io_uring may not work in container)
          CIBW_TEST_SKIP: "*"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
